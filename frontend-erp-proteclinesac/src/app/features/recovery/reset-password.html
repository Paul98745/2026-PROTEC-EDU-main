<main class="recovery-shell">
  <section>
    <a routerLink="/ingresar" class="back">← Volver a ingresar</a>
    <p class="eyebrow">Nueva contraseña</p>
    <h1>Protege tu cuenta</h1>
    @if (done()) {
      <p class="notice">Contraseña actualizada. Redirigiendo al ingreso…</p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()">
        <label
          >Código de recuperación<input formControlName="token" autocomplete="one-time-code"
        /></label>
        <label
          >Nueva contraseña<input
            formControlName="newPassword"
            type="password"
            autocomplete="new-password"
        /></label>
        <small>8 caracteres o más, con mayúscula, minúscula, número y carácter especial.</small>
        @if (error()) {
          <p class="error" role="alert">{{ error() }}</p>
        }
        <button type="submit">Restablecer contraseña</button>
      </form>
    }
  </section>
</main>
