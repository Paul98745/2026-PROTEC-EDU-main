<main class="password-shell">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <p class="eyebrow">ProtecEdu</p>
    <h1>Actualiza tu contraseña</h1>
    <p>Para proteger tu cuenta, crea una contraseña nueva antes de continuar.</p>
    <label
      >Contraseña actual<input
        type="password"
        autocomplete="current-password"
        formControlName="currentPassword"
    /></label>
    <label
      >Nueva contraseña<input
        type="password"
        autocomplete="new-password"
        formControlName="newPassword"
    /></label>
    <small
      >Usa al menos 8 caracteres, una mayúscula, una minúscula, un número y un carácter
      especial.</small
    >
    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }
    <button type="submit" [disabled]="submitting()">
      {{ submitting() ? 'Actualizando…' : 'Actualizar y volver a ingresar' }}
    </button>
  </form>
</main>
